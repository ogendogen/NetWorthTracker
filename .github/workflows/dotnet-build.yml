name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .NET solution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore NetWorthTracker.Api/NetWorthTracker.Api.slnx

      - name: Build solution
        run: dotnet build NetWorthTracker.Api/NetWorthTracker.Api.slnx --configuration Release --no-restore

  angular-build:
    name: Build Angular SPA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NetWorthTracker.Spa

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: NetWorthTracker.Spa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular SPA
        run: npm run build