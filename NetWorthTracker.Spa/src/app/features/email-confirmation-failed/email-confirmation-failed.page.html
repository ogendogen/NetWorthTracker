<main class="email-confirmation-failed-page">
  <mat-card class="email-confirmation-failed-card">
    <mat-card-header>
      <mat-card-title>{{ 'common.productName' | translate }}</mat-card-title>
      <mat-card-subtitle>{{ 'emailConfirmationFailed.title' | translate }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p class="confirmation-failed-message" role="status">
        {{ 'emailConfirmationFailed.message' | translate }}
      </p>
      <a mat-flat-button routerLink="/login">{{ 'emailConfirmationFailed.signIn' | translate }}</a>
    </mat-card-content>
  </mat-card>
</main>
