<main class="email-confirmed-page">
  <mat-card class="email-confirmed-card">
    <mat-card-header>
      <mat-card-title>{{ 'common.productName' | translate }}</mat-card-title>
      <mat-card-subtitle>{{ 'emailConfirmation.title' | translate }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p class="confirmation-message" role="status">
        {{ 'emailConfirmation.success' | translate }}
      </p>
      <p class="redirect-message">
        {{ 'emailConfirmation.redirect' | translate: { seconds: secondsRemaining() } }}
      </p>
      <a mat-flat-button routerLink="/login">{{ 'emailConfirmation.signIn' | translate }}</a>
    </mat-card-content>
  </mat-card>
</main>
