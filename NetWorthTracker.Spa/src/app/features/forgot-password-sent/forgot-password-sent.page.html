<main class="forgot-password-sent-page">
  <mat-card class="forgot-password-sent-card">
    <mat-card-header>
      <mat-card-title>{{ 'common.productName' | translate }}</mat-card-title>
      <mat-card-subtitle>{{ 'forgotPasswordSent.title' | translate }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p class="forgot-password-sent-message" role="status">
        {{ 'forgotPasswordSent.message' | translate }}
      </p>
      <p>{{ 'forgotPasswordSent.expiry' | translate }}</p>
      <a mat-flat-button routerLink="/login">{{ 'forgotPasswordSent.signIn' | translate }}</a>
    </mat-card-content>
  </mat-card>
</main>
