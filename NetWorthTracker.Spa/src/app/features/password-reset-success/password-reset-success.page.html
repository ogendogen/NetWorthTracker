<main class="password-reset-success-page">
  <mat-card class="password-reset-success-card">
    <mat-card-header>
      <mat-card-title>{{ 'common.productName' | translate }}</mat-card-title>
      <mat-card-subtitle>{{ 'passwordResetSuccess.title' | translate }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p class="success-message" role="status">
        {{ 'passwordResetSuccess.success' | translate }}
      </p>
      <p class="redirect-message">
        {{ 'passwordResetSuccess.redirect' | translate: { seconds: secondsRemaining() } }}
      </p>
      <a mat-flat-button routerLink="/login">{{ 'passwordResetSuccess.signIn' | translate }}</a>
    </mat-card-content>
  </mat-card>
</main>
