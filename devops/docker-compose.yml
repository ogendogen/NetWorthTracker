name: networthtracker

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: networthtracker
      POSTGRES_USER: networthtracker
      POSTGRES_PASSWORD: networthtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U networthtracker -d networthtracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
